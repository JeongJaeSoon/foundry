  <rect class="box" x="32" y="274" width="146" height="44" rx="6"/><text x="105" y="294" text-anchor="middle">toasts</text><text x="105" y="310" text-anchor="middle" class="t-xs">escalations · stalls</text>
  <rect class="box" x="32" y="326" width="146" height="44" rx="6"/><text x="105" y="346" text-anchor="middle">approve buttons</text><text x="105" y="362" text-anchor="middle" class="t-xs">tier 3 · override</text>
  <rect class="grp" x="32" y="384" width="146" height="50" rx="6"/><text x="105" y="404" text-anchor="middle" class="t-s">agent.spawn</text><text x="105" y="422" text-anchor="middle" class="t-xs">spawn.ts · chain · model</text>
  <rect class="grp-fill" x="230" y="20" width="350" height="120" rx="10"/>
  <text x="244" y="42" class="t-b">agents/*.md</text><text x="566" y="42" text-anchor="end" class="t-xs">model and effort pinned</text>
  <text x="244" y="66" class="t-m">foreman · line-lead · shop-boss</text>
  <text x="244" y="88" class="t-m">hand-light · hand · hand-heavy</text>
  <text x="244" y="110" class="t-m">dispatcher · sweeper-judge · advisor</text>
  <text x="244" y="130" class="t-xs">bin/foundry → scripts/foundry.py (the only CLI models call)</text>
  <rect class="grp-fill" x="610" y="20" width="370" height="120" rx="10"/>
  <text x="624" y="42" class="t-b">skills/</text><text x="966" y="42" text-anchor="end" class="t-xs">loaded through Skill</text>
  <text x="624" y="64" class="t-m">foundry-launch · -resume · -lead-loop</text>
  <text x="624" y="84" class="t-m">foundry-feedback · -escalate · -approve</text>
  <text x="624" y="104" class="t-m">foundry-handoff · -housekeeping · -status</text>
  <text x="624" y="124" class="t-m">model-selection</text>
  <rect class="grp-fill" x="230" y="190" width="350" height="200" rx="10"/>
  <text x="244" y="212" class="t-b">hooks/hooks.json</text><text x="566" y="212" text-anchor="end" class="t-xs">event → script</text>
  <text x="244" y="236" class="t-xs">SessionStart → hook.py · rebuild · recovery brief</text>
  <text x="244" y="256" class="t-xs">PreToolUse → hook.py · chain · Bash shape · git guard · Slack</text>
  <text x="244" y="276" class="t-xs">PostToolUse(+Failure) → hook.py · Slack result · perm.denied</text>
  <text x="244" y="296" class="t-xs">      push · PR · merge to the journal · PermissionDenied</text>
  <text x="244" y="316" class="t-xs">SubagentStart/Stop → hook.py · binding · record gate</text>
  <text x="244" y="336" class="t-xs">PreCompact · SessionEnd · Stop → hook.py · handoff</text>
  <text x="244" y="356" class="t-xs">PermissionRequest → hook.py → approve.py · tier 0–3</text>
  <text x="244" y="378" class="t-xs">modules: board-pane.tsx</text>
  <rect class="grp-fill" x="610" y="190" width="230" height="200" rx="10"/>
  <text x="624" y="212" class="t-b">scripts/</text>
  <text x="624" y="236" class="t-m">foundry.py  CLI</text>
  <text x="624" y="256" class="t-m">launcher.py  --bg sessions</text>
  <text x="624" y="276" class="t-m">approve.py  approval tiers</text>
  <text x="624" y="296" class="t-m">watch.py · sweep.py</text>
  <text x="624" y="316" class="t-m">housekeep.py · pressure.py</text>
  <text x="624" y="336" class="t-m">board.py · handoff.py</text>
  <text x="624" y="356" class="t-m">foundrylib.py  journal</text>
  <text x="624" y="378" class="t-xs">stdlib only · writes under flock</text>
  <rect class="k-amber" x="650" y="420" width="190" height="80" rx="10"/>
  <text x="745" y="442" text-anchor="middle" class="t-b">Monitor · CronCreate</text>
  <text x="725" y="462" text-anchor="middle" class="t-xs">streams print only on events</text>
  <text x="725" y="478" text-anchor="middle" class="t-xs">handover · kaizen · preflight</text>
  <text x="725" y="494" text-anchor="middle" class="t-xs">no OS services</text>
