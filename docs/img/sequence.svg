<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-label="a unit from feedback to done">
<style>
svg { --fg: #1f1e1c; --muted: #66625b; --card: #ffffff; --card2: #f1efe9; --line: #d6d1c6;
  --accent: #b95a37; --accent-soft: #f6e4db; --red: #b83227; --red-soft: #f8e1de; --green: #2a7a4b; --green-soft: #def0e4;
  --amber: #9a6a12; --amber-soft: #f6ecd2; --blue: #2b62a6; --blue-soft: #dfe9f6;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --fg: #ebe7df; --muted: #a29d93; --card: #23221f; --card2: #2b2a26; --line: #3f3c36;
  --accent: #e3906c; --accent-soft: #3b2a21; --red: #f07a6b; --red-soft: #3d2320; --green: #67c48d; --green-soft: #1f3327;
  --amber: #e2b45a; --amber-soft: #382f1c; --blue: #79aee9; --blue-soft: #1e2a3a; } }
.bg { fill: var(--card); }
text { font-family: var(--sans); fill: var(--fg); font-size: 13px; }
.t-m { font-family: var(--mono); font-size: 12px; } .t-s { font-size: 11.5px; fill: var(--muted); }
.t-xs { font-size: 10.5px; fill: var(--muted); } .t-b { font-weight: 700; }
.lbl { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.lbl.red { fill: var(--red); }
.box { fill: var(--card); stroke: var(--line); stroke-width: 1.3; } .box2 { fill: var(--card2); stroke: var(--line); stroke-width: 1.2; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; } .grp-fill { fill: var(--card2); stroke: var(--line); stroke-width: 1.2; }
.k-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; } .k-blue { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.3; }
.k-green { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.3; } .k-amber { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.3; }
.k-red { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.3; }
.e { fill: none; stroke: var(--fg); stroke-width: 1.4; opacity: .75; } .e-acc { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.e-dash { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
.e-red { fill: none; stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 6 4; }
.life { stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.mk { fill: var(--fg); opacity: .8; } .mk-acc { fill: var(--accent); } .mk-red { fill: var(--red); } .mk-mut { fill: var(--muted); }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
  <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-red"/></marker>
  <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-mut"/></marker>
</defs>
<rect class="bg" width="1000" height="820" rx="10"/>
  <rect class="k-acc" x="10" y="16" width="90" height="42" rx="6"/><text x="55" y="42" text-anchor="middle" class="t-b">owner</text>
  <rect class="k-acc" x="120" y="16" width="90" height="42" rx="6"/><text x="165" y="42" text-anchor="middle" class="t-b">foreman</text>
  <rect class="box" x="226" y="16" width="98" height="42" rx="6"/><text x="275" y="42" text-anchor="middle" class="t-b">dispatcher</text>
  <rect class="box2" x="336" y="16" width="108" height="42" rx="6"/><text x="390" y="34" text-anchor="middle" class="t-b">state</text><text x="390" y="50" text-anchor="middle" class="t-xs">journal · inbox</text>
  <rect class="k-blue" x="458" y="16" width="94" height="42" rx="6"/><text x="505" y="42" text-anchor="middle" class="t-b">line-lead</text>
  <rect class="k-green" x="570" y="16" width="90" height="42" rx="6"/><text x="615" y="42" text-anchor="middle" class="t-b">hand</text>
  <rect class="box" x="680" y="16" width="90" height="42" rx="6"/><text x="725" y="42" text-anchor="middle" class="t-b">GitHub</text>
  <rect class="k-amber" x="790" y="16" width="90" height="42" rx="6"/><text x="835" y="34" text-anchor="middle" class="t-b">Monitor</text><text x="835" y="50" text-anchor="middle" class="t-xs">foreman stream</text>
  <rect class="box" x="900" y="16" width="90" height="42" rx="6"/><text x="945" y="34" text-anchor="middle" class="t-b">external</text><text x="945" y="50" text-anchor="middle" class="t-xs">trackers · notes</text>
  <g>
    <line class="life" x1="55" y1="58" x2="55" y2="805"/><line class="life" x1="165" y1="58" x2="165" y2="805"/>
    <line class="life" x1="275" y1="58" x2="275" y2="805"/><line class="life" x1="390" y1="58" x2="390" y2="805"/>
    <line class="life" x1="505" y1="58" x2="505" y2="805"/><line class="life" x1="615" y1="58" x2="615" y2="805"/>
    <line class="life" x1="725" y1="58" x2="725" y2="805"/><line class="life" x1="835" y1="58" x2="835" y2="805"/>
    <line class="life" x1="945" y1="58" x2="945" y2="805"/>
  </g>
  <path class="e-acc" d="M55,90 H163" marker-end="url(#ar-acc)"/><text class="lbl" x="110" y="84" text-anchor="middle">① feedback</text>
  <path class="e" d="M165,126 H273" marker-end="url(#ar)"/><text class="lbl" x="220" y="120" text-anchor="middle">② intake (Agent)</text>
  <path class="e" d="M275,162 H388" marker-end="url(#ar)"/><text class="lbl" x="332" y="156" text-anchor="middle">③ inbox route</text>
  <path class="e-dash" d="M275,198 H167" marker-end="url(#ar-mut)"/><text class="lbl" x="220" y="192" text-anchor="middle">existing unit PROJ-123</text>
  <path class="e-acc" d="M165,234 H503" marker-end="url(#ar-acc)"/><text class="lbl" x="335" y="228" text-anchor="middle">④ foundry unit resume (claude --bg --resume)</text>
  <path class="e-dash" d="M390,270 H503" marker-end="url(#ar-mut)"/><text class="lbl" x="447" y="264" text-anchor="middle">inbox injected</text>
  <path class="e" d="M505,306 H613" marker-end="url(#ar)"/><text class="lbl" x="560" y="300" text-anchor="middle">⑤ Agent(hand)</text>
  <path class="e" d="M615,342 H723" marker-end="url(#ar)"/><text class="lbl" x="670" y="336" text-anchor="middle">⑥ push · PR</text>
  <path class="e-dash" d="M725,362 H392" marker-end="url(#ar-mut)"/><text class="lbl" x="560" y="372" text-anchor="middle">PostToolUse → journal</text>
  <rect class="k-amber" x="470" y="388" width="290" height="30" rx="4"/><text x="615" y="408" text-anchor="middle" class="t-xs">⑦ CI wait: the lead's Monitor (≤30 min) ⇄ GitHub</text>
  <path class="e" d="M505,446 H392" marker-end="url(#ar)"/><text class="lbl" x="447" y="440" text-anchor="middle">⑧ wait add · handoff</text>
  <rect class="box2" x="440" y="454" width="130" height="22" rx="4"/><text x="505" y="469" text-anchor="middle" class="t-xs">review wait → park</text>
  <path class="e" d="M835,504 H727" marker-end="url(#ar)"/><text class="lbl" x="780" y="498" text-anchor="middle">⑨ gh watch</text>
  <path class="e" d="M835,540 H392" marker-end="url(#ar)"/><text class="lbl" x="612" y="534" text-anchor="middle">⑩ event: review approved</text>
  <path class="e" d="M835,560 H167" marker-end="url(#ar)"/><text class="lbl" x="500" y="574" text-anchor="middle">one line of Monitor output wakes the foreman</text>
  <path class="e-acc" d="M165,604 H503" marker-end="url(#ar-acc)"/><text class="lbl" x="335" y="598" text-anchor="middle">⑪ resume (the handoff is the prompt)</text>
  <path class="e" d="M505,640 H723" marker-end="url(#ar)"/><text class="lbl" x="614" y="634" text-anchor="middle">⑫ merge · dev deploy · verify</text>
  <path class="e" d="M505,676 H392" marker-end="url(#ar)"/><text class="lbl" x="447" y="670" text-anchor="middle">⑬ verify evidence → done</text>
  <rect class="k-green" x="325" y="684" width="130" height="22" rx="4"/><text x="390" y="699" text-anchor="middle" class="t-xs">verify gate passed</text>
  <path class="e" d="M390,730 H273" marker-end="url(#ar)"/><text class="lbl" x="332" y="724" text-anchor="middle">⑭ sync.needed</text>
  <path class="e" d="M275,756 H943" marker-end="url(#ar)"/><text class="lbl" x="610" y="750" text-anchor="middle">⑮ tracker comment · note (MCP) · board: done</text>
  <path class="e-dash" d="M165,790 H53" marker-end="url(#ar-mut)"/><text class="lbl" x="110" y="784" text-anchor="middle">⑯ 08:00 handover</text>
</svg>
