<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="housekeeping: watch, judge, execute">
<style>
svg { --fg: #1f1e1c; --muted: #66625b; --card: #ffffff; --card2: #f1efe9; --line: #d6d1c6;
  --accent: #b95a37; --accent-soft: #f6e4db; --red: #b83227; --red-soft: #f8e1de; --green: #2a7a4b; --green-soft: #def0e4;
  --amber: #9a6a12; --amber-soft: #f6ecd2; --blue: #2b62a6; --blue-soft: #dfe9f6;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --fg: #ebe7df; --muted: #a29d93; --card: #23221f; --card2: #2b2a26; --line: #3f3c36;
  --accent: #e3906c; --accent-soft: #3b2a21; --red: #f07a6b; --red-soft: #3d2320; --green: #67c48d; --green-soft: #1f3327;
  --amber: #e2b45a; --amber-soft: #382f1c; --blue: #79aee9; --blue-soft: #1e2a3a; } }
.bg { fill: var(--card); }
text { font-family: var(--sans); fill: var(--fg); font-size: 13px; }
.t-m { font-family: var(--mono); font-size: 12px; } .t-s { font-size: 11.5px; fill: var(--muted); }
.t-xs { font-size: 10.5px; fill: var(--muted); } .t-b { font-weight: 700; }
.lbl { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.lbl.red { fill: var(--red); }
.box { fill: var(--card); stroke: var(--line); stroke-width: 1.3; } .box2 { fill: var(--card2); stroke: var(--line); stroke-width: 1.2; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; } .grp-fill { fill: var(--card2); stroke: var(--line); stroke-width: 1.2; }
.k-acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; } .k-blue { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.3; }
.k-green { fill: var(--green-soft); stroke: var(--green); stroke-width: 1.3; } .k-amber { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.3; }
.k-red { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.3; }
.e { fill: none; stroke: var(--fg); stroke-width: 1.4; opacity: .75; } .e-acc { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.e-dash { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
.e-red { fill: none; stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 6 4; }
.life { stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 4; }
.mk { fill: var(--fg); opacity: .8; } .mk-acc { fill: var(--accent); } .mk-red { fill: var(--red); } .mk-mut { fill: var(--muted); }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
  <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-acc"/></marker>
  <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-red"/></marker>
  <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-mut"/></marker>
</defs>
<rect class="bg" width="1000" height="440" rx="10"/>
  <rect class="grp-fill" x="20" y="20" width="210" height="260" rx="10"/>
  <text x="34" y="42" class="t-b">watch (sweep.py scan)</text>
  <text x="34" y="60" class="t-xs">no model · fed by the streams</text>
  <rect class="box" x="34" y="72" width="182" height="36" rx="6"/><text x="125" y="95" text-anchor="middle">sessions</text>
  <rect class="box" x="34" y="116" width="182" height="36" rx="6"/><text x="125" y="139" text-anchor="middle">worktree directories</text>
  <rect class="box" x="34" y="160" width="182" height="36" rx="6"/><text x="125" y="183" text-anchor="middle">docker</text>
  <rect class="k-amber" x="34" y="204" width="182" height="36" rx="6"/><text x="125" y="227" text-anchor="middle">PC pressure (pressure.py)</text>
  <text x="34" y="266" class="t-xs">candidates → housekeeping event</text>
  <path class="e" d="M230,140 H258" marker-end="url(#ar)"/>
  <polygon class="box" points="260,140 330,100 400,140 330,180"/><text x="330" y="145" text-anchor="middle" class="t-b">judgment?</text>
  <path class="e-dash" d="M330,180 V222" marker-end="url(#ar-mut)"/><text class="lbl" x="338" y="204">safe class only</text>
  <rect class="box2" x="262" y="224" width="136" height="40" rx="6"/><text x="330" y="249" text-anchor="middle" class="t-s">straight to executor</text>
  <path class="e" d="M400,140 H428" marker-end="url(#ar)"/><text class="lbl" x="408" y="132">yes</text>
  <rect class="k-green" x="430" y="100" width="180" height="80" rx="8"/>
  <text x="520" y="124" text-anchor="middle" class="t-b">sweeper-judge</text><text x="520" y="144" text-anchor="middle" class="t-s">Haiku · safe / propose / skip</text>
  <text x="520" y="164" text-anchor="middle" class="t-xs">Bash: housekeep scan|plan only</text>
  <path class="e" d="M610,140 H638" marker-end="url(#ar)"/><text class="lbl" x="624" y="128" text-anchor="middle">plan</text>
  <path class="e" d="M398,244 H720 V182" marker-end="url(#ar)"/>
  <rect class="k-blue" x="640" y="100" width="160" height="80" rx="8"/>
  <text x="720" y="124" text-anchor="middle" class="t-b">executor</text><text x="720" y="144" text-anchor="middle" class="t-s">housekeep.py execute</text>
  <text x="720" y="164" text-anchor="middle" class="t-xs">re-checks · fails closed</text>
  <path class="e" d="M800,124 H818 V70 H828" marker-end="url(#ar)"/>
  <rect class="k-green" x="830" y="20" width="160" height="150" rx="8"/>
  <text x="910" y="40" text-anchor="middle" class="t-b">auto cleanup (safe)</text>
  <text x="842" y="62" class="t-xs">· worktrees* (no --force)</text>
  <text x="842" y="80" class="t-xs">· foundry-* compose</text>
  <text x="842" y="98" class="t-xs">· dangling images</text>
  <text x="842" y="116" class="t-xs">· build cache &gt; 7 days</text>
  <text x="842" y="134" class="t-xs">· sessions of done units</text>
  <text x="842" y="152" class="t-xs">  (stopped by the launcher)</text>
  <path class="e" d="M800,156 H818 V218 H828" marker-end="url(#ar)"/>
  <rect class="k-acc" x="830" y="194" width="160" height="56" rx="8"/>
  <text x="910" y="216" text-anchor="middle" class="t-b">proposed to owner</text><text x="910" y="236" text-anchor="middle" class="t-xs">board footer · all the rest</text>
  <path class="e-acc" d="M200,240 V312" marker-end="url(#ar-acc)"/>
  <rect class="k-amber" x="20" y="314" width="620" height="56" rx="8"/>
  <text x="34" y="337" class="t-b">PC pressure high</text>
  <text x="34" y="358" class="t-s">the launcher holds new leads → safe cleanup runs first → shown in the band and the PC pane</text>
  <path class="e-acc" d="M640,342 H720 V182" marker-end="url(#ar-acc)"/><text class="lbl" x="680" y="336" text-anchor="middle">priority run</text>
  <text x="20" y="404" class="t-xs">* worktree cleanup needs: PR merged or closed · PR head = worktree HEAD · nothing uncommitted, unpushed or ignored · no process using it (lsof) · one removal function.</text>
  <text x="20" y="422" class="t-xs">  A wrong safe verdict deletes nothing: the executor re-checks the same conditions, and any git, gh or lsof failure counts as unsafe.</text>
</svg>
